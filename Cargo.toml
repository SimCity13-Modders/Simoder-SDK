[workspace]
resolver = "2"
members = [
    "crates/simoder-sdk-verifier",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
hex = "0.4"
mlua = { version = "0.12", features = ["luau", "vendored", "send", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[profile.release]
strip = true
lto = true
