name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test SDK Verifier
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SimCity13-Modders/Simoder-Base
          ref: 6f98f956cb2d7f2b03dca983510cb0b87768b995
          path: Simoder-Base
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests
        env:
          SIMODER_BASE_DIR: ${{ github.workspace }}/Simoder-Base
        run: cargo test --workspace
